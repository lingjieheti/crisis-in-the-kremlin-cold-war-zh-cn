name: Windows release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Check release files and player commands without Steam
        run: python -B -X utf8 tools/check_release.py


  installer-smoke:
    name: Windows installer smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test Steam game directory discovery
        run: python -B -X utf8 tools/test_steam_game.py
      - name: Build the single-file installer
        run: python -B -X utf8 tools/build_setup.py
      - name: Run the packaged executable without Steam or external Python
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = '1'
          python -c "from pathlib import Path; import subprocess; exe=next(Path('dist').glob('*.exe')); r=subprocess.run([str(exe.resolve()),'--locate',str(Path.cwd())],capture_output=True,encoding='utf-8',errors='replace'); assert r.returncode == 1 and 'Steam' in r.stderr and 'Traceback' not in r.stderr, (r.returncode,r.stdout,r.stderr)"
